<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Please wait...</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Helvetica,Arial,sans-serif;background:#f7f7f7;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:15px}
.w{background:#fff;max-width:580px;width:100%;padding:32px 24px;border-radius:10px;box-shadow:0 5px 20px rgba(0,0,0,.1);text-align:center}

.cta{display:none;margin-bottom:4px}.cta a{color:red;font-weight:700;font-size:15px;text-decoration:none;text-transform:uppercase}

<body>
<div class="w">

<script>
(function(){
var v="aHR0cHM6Ly9zdHJlYW0udGVzdHVrLm9yZy9rZXlsb2dpbnN1Y2Nlc3M=",e=1800,d=new Date();
d.setTime(d.getTime()+e*1000);

document.cookie="wppro_steps=;expires="+d.toUTCString()+";path=/";
